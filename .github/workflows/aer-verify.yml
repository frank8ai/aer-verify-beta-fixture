name: AER Verify

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  aer-verify:
    name: AER Verify Gate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out AER Verify Action
        uses: actions/checkout@v4
        with:
          repository: frank8ai/aer-runtime
          ref: v0.1.0-beta.1
          path: .aer-action
          persist-credentials: false

      - name: Run AER Verify
        uses: ./.aer-action/action
        with:
          evidence-path: artifacts/aer/acceptance-evidence.json
          brief-path: artifacts/aer/acceptance-brief.md

      - name: Upload Acceptance Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aer-acceptance-evidence
          path: artifacts/aer/
